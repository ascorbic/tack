name: Test
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      update-snapshots:
        description: "Regenerate the e2e screenshot baselines on Linux, and upload them as an artifact"
        type: boolean
        default: false
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
      # The docs site; broken links between its pages fail the build.
      - name: Build docs
        run: pnpm --filter site build
  e2e:
    # Split across runners: each shard runs a quarter of the suite in parallel.
    name: e2e (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install dependencies
        run: vp install
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Cache browsers
        id: browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install browsers
        if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install browser system dependencies
        if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - name: E2E
        run: pnpm e2e --shard=${{ matrix.shard }}/4 ${{ inputs.update-snapshots && '--update-snapshots' || '' }}
        env:
          # Pixel comparison is opt-in; the manual update-snapshots run turns it on.
          VISUAL: ${{ inputs.update-snapshots && '1' || '' }}
      - name: Upload traces and screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results-${{ matrix.shard }}
          path: |
            e2e/test-results/
            e2e/report/
          retention-days: 14
      - name: Upload Linux baselines
        if: inputs.update-snapshots
        uses: actions/upload-artifact@v4
        with:
          name: e2e-linux-baselines-${{ matrix.shard }}
          path: e2e/**/*-linux.png
